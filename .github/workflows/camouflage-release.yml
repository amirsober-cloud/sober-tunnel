name: Build and validate release

on:
  push:
    tags: ["v0.4.1"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft release tag
        required: true
        default: v0.4.1
        type: string

      validation_run:
        description: Successful v2 validation run for the same engine source
        required: true
        default: '44920800805'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      VALIDATION_RUN: ${{ inputs.validation_run || '44920800805' }}
    steps:
      - name: Resolve draft release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == push ]]; then
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$RELEASE_VERSION" --notes "Camouflage equal-load scheduling and nonblocking stream admission."
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os, re
          with open(os.environ['RUNNER_TEMP'] + '/releases.json') as f:
              release = next(r for r in json.load(f) if r['tag_name'] == os.environ['RELEASE_VERSION'])
          assert release['draft'], 'Refusing to replace public release artifacts'
          commit = release['target_commitish']
          assert re.fullmatch(r'[0-9a-f]{40}', commit), 'Draft must pin a full source commit'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('commit=' + commit + '\n')
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.sum
            go.work.sum
            engines/backpack/go.sum
            engines/camouflage/go.sum

      - name: Load pinned release public key
        run: echo "RELEASE_PUBLIC_KEY=$(cat docs/release-public-key.txt)" >> "$GITHUB_ENV"

      - name: Install static capture build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential flex bison libpcap-dev

      - name: Check installer and build script syntax
        run: bash -n install.sh scripts/build.sh scripts/package.sh

      - name: Build both Linux executables and archive
        run: bash scripts/package.sh

      - name: Run Linux engine and native pairing checks
        run: |
          node engines/backpack/internal/webui/paneltest/mimic-form.test.mjs
          node --input-type=module --check < engines/backpack/internal/webui/panel/js/views/overview.js
          node --input-type=module --check < engines/backpack/internal/webui/panel/js/views/mimic-tools.js
          go test -race -timeout 3m ./engines/camouflage/internal/mimic ./engines/camouflage/internal/securestream ./engines/camouflage/internal/resumestream ./engines/camouflage/internal/pool ./engines/camouflage/internal/ingress ./engines/camouflage/tooling ./engines/backpack/internal/mimicmgr
          go test -timeout 3m ./engines/backpack/internal/webui
          go test -timeout 3m ./...
          go test -timeout 3m ./engines/backpack/internal/app ./engines/backpack/internal/cli
          go vet ./...
          go test -race -timeout 3m ./internal/connection ./internal/forward ./internal/mux
          go test -timeout 3m ./engines/backpack/internal/mimicmgr ./engines/camouflage/config ./engines/camouflage/internal/securestream ./engines/camouflage/internal/pool ./engines/camouflage/internal/persona ./engines/camouflage/internal/logging
          go test -timeout 3m ./engines/backpack/internal/manage -run 'Test(AReleaseSignatureIsGoodForItsOwnTagOnly|ASignatureOverTheChecksumsIsCheckedAgainstThePinnedKey|ABuildWithNoPinnedKeyStillInstalls|AMalformedPinnedKeyRefusesRatherThanSkips|TheSigningToolAndTheVerifierAgree|UnsignedUpdateHasActionableBootstrapError|HashFor.*|VerifyChecksumAcceptsAndRejects)$'
          go test -timeout 3m ./engines/backpack/internal/menu -run 'Test(AnUpdateReopensTheMenuOnTheNewBinary|TheRelayOfferSaysSoWhenThereIsNoWayOut)$'

      - name: Require successful validation of the matching engine source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_RUN" =~ ^[0-9]+$ ]]
          for attempt in $(seq 1 50); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN" > "$RUNNER_TEMP/validation.json"
            status=$(jq -r .status "$RUNNER_TEMP/validation.json")
            [[ "$status" == completed ]] && break
            echo "Waiting for the complete engine and browser validation ($status)"
            sleep 30
          done
          test "$(jq -r .conclusion "$RUNNER_TEMP/validation.json")" = success
          test "$(jq -r .path "$RUNNER_TEMP/validation.json")" = .github/workflows/v2-validation.yml
          validated_sha=$(jq -r .head_sha "$RUNNER_TEMP/validation.json")
          git merge-base --is-ancestor "$validated_sha" HEAD
          # Release notes and workflow changes may follow validation; runtime
          # source and build inputs must match. Only comments changed in the
          # capture dependency builder's documentation.
          git diff --exit-code "$validated_sha" HEAD -- . ':!docs/**' ':!README.md' ':!.github/**' ':!engines/backpack/scripts/build-libpcap.sh'
          git diff --exit-code --ignore-matching-lines='^#' "$validated_sha" HEAD -- engines/backpack/scripts/build-libpcap.sh

      - name: Sign release checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          go run ./engines/backpack/tools/signsums build/SHA256SUMS "$RELEASE_VERSION"
          test -s build/SHA256SUMS.sig

      - name: Upload checked assets and publish release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          (cd build && sha256sum -c SHA256SUMS)
          gh release upload "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" build/sober-tunnel_linux_amd64.tar.gz build/SHA256SUMS build/SHA256SUMS.sig --clobber
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then
            gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi

      - name: Verify published release through the updater
        env:
          RELEASE_VERIFICATION_TAG: ${{ inputs.version || github.ref_name }}
        run: go test -v -count=1 -timeout 3m ./engines/backpack/internal/manage -run '^TestPublishedReleaseSignatureAndArchive$'
