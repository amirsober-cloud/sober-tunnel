name: Validate v2 integration
on:
  push:
    branches: [work/v2-security-resume]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            engines/backpack/go.sum
            engines/camouflage/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev flex bison
      - name: Build combined distribution
        run: bash scripts/build.sh
      - name: Check continuation and pool races
        run: go test -race -count 5 -timeout 3m ./engines/camouflage/internal/resumestream ./engines/camouflage/internal/ingress ./engines/camouflage/internal/pool
      - name: Validate all engine packages
        env:
          BACKPACK_CURRENT_BINARY: ${{ github.workspace }}/build/sober-tunnel
        run: go test -p 4 -timeout 12m ./engines/backpack/... ./engines/camouflage/...
      - name: Check browser code
        run: |
          find engines/backpack/internal/webui/panel/js -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 sh -c 'node --input-type=module --check < "$0"'
          node engines/backpack/internal/webui/paneltest/mimic-form.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-binaries
          path: |
            build/sober-tunnel
            build/sober-tunnel-mimic
  raw-carriers:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: integration-binaries
          path: build
      - run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables bc
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          chmod +x build/sober-tunnel build/sober-tunnel-mimic
      - name: Direct PCK, IPv4 GRE and IPv6 GRE on isolated networks
        run: |
          export BIN="$PWD/build/sober-tunnel"
          for carrier in pck gre ip6gre; do
            export W="$(mktemp -d)"
            timeout 240 unshare --map-auto --map-root-user --net --mount --fork -- bash engines/backpack/internal/e2e/testdata/l3live.sh "$carrier" | tee "build/$carrier-live.log"
            grep -q '^RESULT OK' "build/$carrier-live.log"
          done
      - name: Reverse PCK interface recovery
        run: |
          export BIN="$PWD/build/sober-tunnel" W="$(mktemp -d)"
          timeout 240 unshare --map-auto --map-root-user --net --mount --fork -- bash engines/backpack/internal/e2e/testdata/revpcklive.sh | tee build/reverse-pck-live.log
          grep -q '^RESULT OK' build/reverse-pck-live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-carrier-evidence
          path: build/*-live.log  compatibility:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - uses: actions/download-artifact@v4
        with:
          name: integration-binaries
          path: build
      - name: Fetch pinned previous distribution
        run: |
          sudo apt-get update && sudo apt-get install -y libpcap-dev
          mkdir -p build/previous
          curl -fL --retry 3 https://github.com/amirsober-cloud/sober-tunnel/releases/download/v0.3.2/sober-tunnel_linux_amd64.tar.gz -o build/previous.tar.gz
          echo 'f7715f1e7b6bdead9e5c9fe0195884f2af39e7c1b7a02f4d62abb42378de4d01  build/previous.tar.gz' | sha256sum -c -
          tar -xzf build/previous.tar.gz -C build/previous
          chmod +x build/sober-tunnel build/previous/sober-tunnel
      - name: Mixed-version carriers and persistent downgrade protection
        env:
          BACKPACK_CURRENT_BINARY: ${{ github.workspace }}/build/sober-tunnel
          BACKPACK_PREV_BINARY: ${{ github.workspace }}/build/previous/sober-tunnel
        run: go test -v -timeout 10m ./engines/backpack/internal/e2e -run 'Test(ThePreviousReleaseStillTalksToThisOne|AProvedTunnelRefusesTheOlderHandshake)$'